[project]
name = "cqa-backend"
version = "0.1.0"
description = "CQA HTTP API: import, SQLite storage, evaluation jobs, appeals and exports"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cqa-ai",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv.sources]
cqa-ai = { path = "../ai", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cqa_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
